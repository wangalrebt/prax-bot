[project]
name = "prax-bot"
version = "0.1.0"
description = "A coding agent that works inside a Nebius Token Factory Sandbox, powered by NVIDIA Nemotron."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "contree-sdk>=0.3.6",
    "openai>=1.60",
    "pydantic>=2.7",
    "rich>=13",
    "textual>=8.2.8",
    "typer>=0.12",
]

[project.scripts]
prax = "prax_bot.ui.cli:app"
praxbot = "prax_bot.ui.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.16.6",
]
# scripts/swe_bench.py only: the dataset and the official grader. `uv run --group bench python scripts/swe_bench.py ...`
bench = [
    "huggingface-hub>=1.30.0",
    "pyarrow>=25.0.1",
    "swebench>=5.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PIE", "PLW", "TRY004", "FURB"]
# B008: typer.Option(...) defaults are the library's idiom. E501: the formatter wraps what it can; long strings stay.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
