[project]
name = "prax-bot"
version = "0.1.0"
description = "A coding agent that works inside a Nebius Token Factory Sandbox, powered by NVIDIA Nemotron."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "contree-sdk>=0.3.6",
    "openai>=1.60",
    "pydantic>=2.7",
    "rich>=13",
    "textual>=8.2.8",
    "typer>=0.12",
]

[project.scripts]
prax = "prax_bot.cli:app"
praxbot = "prax_bot.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "huggingface-hub>=1.30.0",
    "pyarrow>=25.0.1",
    "pytest>=8",
    "swebench>=5.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
